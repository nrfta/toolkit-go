[psql]
  dbname  = "testdb"
  host    = "localhost"
  port    = 5433
  user    = "postgres"
  pass    = "postgres"
  sslmode = "disable"
  schema  = "public"

output   = "models"
pkgname  = "models"
wipe     = true
no-tests = true

# Use the aarondl fork
[psql.imports]
  all = ["github.com/aarondl/sqlboiler/v4/boil"]
